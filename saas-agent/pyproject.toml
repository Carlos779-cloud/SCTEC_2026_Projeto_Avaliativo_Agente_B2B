[project]
name = "saas-agent"
version = "0.1.0"
description = "Agente de IA para consulta de assinaturas e concessão de créditos extras B2B"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "langchain>=0.3.0",
    "langchain-groq>=0.3.0",
    "groq>=1.7.0",
    "langgraph>=0.2.0",
]

[tool.uv]
package = false
